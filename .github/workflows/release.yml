name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with: { dotnet-version: 8.0.x }
      - name: Verify tag matches package version
        run: node -e "const expected='v'+require('./package.json').version;if(process.env.GITHUB_REF_NAME!==expected)throw new Error('Expected tag '+expected+', received '+process.env.GITHUB_REF_NAME)"
      - run: npm ci
      - name: Build Windows artifacts with transient-download retry
        shell: bash
        run: |
          for attempt in 1 2 3; do
            npm run dist:win && exit 0
            test "$attempt" = 3 && exit 1
            sleep 15
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: daytrace-windows
          path: |
            release/Daytrace-Setup-*-x64.exe
            release/Daytrace-Portable-*-x64.zip
  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with: { node-version: 22, cache: npm }
      - name: Verify tag matches package version
        run: node -e "const expected='v'+require('./package.json').version;if(process.env.GITHUB_REF_NAME!==expected)throw new Error('Expected tag '+expected+', received '+process.env.GITHUB_REF_NAME)"
      - name: Import required stable community macOS identity
        env:
          DAYTRACE_COMMUNITY_MAC_CERT_P12: ${{ secrets.DAYTRACE_COMMUNITY_MAC_CERT_P12 }}
          DAYTRACE_COMMUNITY_MAC_CERT_PASSWORD: ${{ secrets.DAYTRACE_COMMUNITY_MAC_CERT_PASSWORD }}
          DAYTRACE_REQUIRE_COMMUNITY_SIGNING: "1"
        run: bash scripts/import-community-macos-certificate.sh
      - run: npm ci
      - name: Build stable-identity non-notarized universal macOS artifacts
        run: |
          for attempt in 1 2 3; do
            npm run dist:mac && exit 0
            test "$attempt" = 3 && exit 1
            sleep 15
          done
      - name: Stage companion macOS install guide beside the artifacts
        run: cp MACOS_INSTALL.txt release/MACOS_INSTALL.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: daytrace-macos
          path: |
            release/Daytrace-*-macOS-universal.dmg
            release/Daytrace-*-macOS-universal.zip
            release/MACOS_INSTALL.txt
  publish:
    runs-on: ubuntu-latest
    needs: [build-windows, build-macos]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with: { path: release, merge-multiple: true }
      - name: Stage the optional version-pinned local classifier pack
        run: |
          cp models/daytrace-smart-v1.json models/daytrace-smart-v1.json.sha256 release/
          cp models/semantic/config.json release/daytrace-semantic-ru-config.json
          cp models/semantic/tokenizer.json release/daytrace-semantic-ru-tokenizer.json
          cp models/semantic/tokenizer_config.json release/daytrace-semantic-ru-tokenizer-config.json
          cp models/semantic/special_tokens_map.json release/daytrace-semantic-ru-special-tokens.json
          cp models/semantic/onnx/model_quantized.onnx release/daytrace-semantic-ru-int8.onnx
          cp models/semantic/LICENSE.txt release/daytrace-semantic-ru-LICENSE.txt
          cp models/semantic-en/config.json release/daytrace-semantic-en-config.json
          cp models/semantic-en/tokenizer.json release/daytrace-semantic-en-tokenizer.json
          cp models/semantic-en/tokenizer_config.json release/daytrace-semantic-en-tokenizer-config.json
          cp models/semantic-en/special_tokens_map.json release/daytrace-semantic-en-special-tokens.json
          cp models/semantic-en/onnx/model_quantized.onnx release/daytrace-semantic-en-int8.onnx
          cp models/semantic-en/LICENSE.txt release/daytrace-semantic-en-LICENSE.txt
      - name: Publish SHA-256 manifest for verified in-app updates
        run: cd release && sha256sum Daytrace-* daytrace-* > SHA256SUMS.txt
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          generate_release_notes: true
          body_path: .github/RELEASE_BODY.md
          files: release/*
