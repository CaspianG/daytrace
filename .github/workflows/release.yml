name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-dotnet@v6
        with: { dotnet-version: 8.0.x }
      - name: Verify tag matches package version
        run: node -e "const expected='v'+require('./package.json').version;if(process.env.GITHUB_REF_NAME!==expected)throw new Error('Expected tag '+expected+', received '+process.env.GITHUB_REF_NAME)"
      - run: npm ci
      - name: Build Windows artifacts with transient-download retry
        shell: bash
        run: |
          for attempt in 1 2 3; do
            npm run dist:win && exit 0
            test "$attempt" = 3 && exit 1
            sleep 15
          done
      - uses: actions/upload-artifact@v7
        with:
          name: daytrace-windows
          path: |
            release/Daytrace-Setup-*-x64.exe
            release/Daytrace-Portable-*-x64.zip
  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - name: Verify tag matches package version
        run: node -e "const expected='v'+require('./package.json').version;if(process.env.GITHUB_REF_NAME!==expected)throw new Error('Expected tag '+expected+', received '+process.env.GITHUB_REF_NAME)"
      - run: npm ci
      - name: Build macOS artifacts with transient-download retry
        run: |
          for attempt in 1 2 3; do
            npm run dist:mac && exit 0
            test "$attempt" = 3 && exit 1
            sleep 15
          done
      - uses: actions/upload-artifact@v7
        with:
          name: daytrace-macos
          path: |
            release/Daytrace-*-macOS-universal.dmg
            release/Daytrace-*-macOS-universal.zip
  publish:
    runs-on: ubuntu-latest
    needs: [build-windows, build-macos]
    steps:
      - uses: actions/download-artifact@v8
        with: { path: release, merge-multiple: true }
      - name: Publish SHA-256 manifest for verified in-app updates
        run: cd release && sha256sum Daytrace-* > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: release/*
